# Persistint web build — nginx TLS site for gemini-exec-host
# Hostname: persistint.gnomatix.com (matches *.gnomatix.com wildcard)
# Cert deploy path in container: /etc/nginx/certs/gnomatix/{fullchain.pem,privkey.pem}
server {
    listen 443 ssl;
    listen 9443 ssl;
    http2 on;
    server_name persistint.gnomatix.com;

    ssl_certificate     /etc/nginx/certs/gnomatix/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/gnomatix/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/persistint/web;
    index index.html;

    access_log /var/log/nginx/persistint.access.log;
    error_log  /var/log/nginx/persistint.error.log;

    include /etc/nginx/mime.types;
    types { application/wasm wasm; }

    gzip on;
    gzip_types application/wasm application/javascript text/css;

    location / {
        try_files $uri =404;
    }
}

# Plain HTTP: redirect to TLS; 9080 stays plain for wired-LAN dev access
server {
    listen 80 default_server;
    server_name _;
    return 301 https://persistint.gnomatix.com$request_uri;
}

server {
    listen 9080;
    root /opt/persistint/web;
    index index.html;
    access_log /var/log/nginx/persistint.access.log;
    include /etc/nginx/mime.types;
    types { application/wasm wasm; }
    location / { try_files $uri =404; }
}
