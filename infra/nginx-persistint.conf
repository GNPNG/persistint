# Persistint web build — nginx site config
# Ports: 80 (convenience) + 9080 (canonical app port per LAN convention)
server {
    listen 80 default_server;
    listen 9080;

    root /opt/persistint/web;
    index index.html;

    access_log /var/log/nginx/persistint.access.log;
    error_log  /var/log/nginx/persistint.error.log;

    include /etc/nginx/mime.types;
    types { application/wasm wasm; }

    gzip on;
    gzip_types application/wasm application/javascript text/css;

    location / {
        try_files $uri =404;
    }
}
