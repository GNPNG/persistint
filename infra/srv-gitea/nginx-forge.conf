# NAS nginx: HTTPS front for the development-tier Gitea on srv. TLS certificates live here only;
# the container speaks plain HTTP on the LAN. The three settings that matter for git over HTTPS
# are the unlimited body size, request buffering off and the long upstream timeouts: the 2026-10-24
# outage showed up as 504s from this layer while receive-pack starved.
#
# DSM: either paste the proxy_* lines into the reverse-proxy rule's custom headers / advanced
# settings, or drop this file under /usr/local/etc/nginx/sites-enabled/ and `nginx -s reload`.
server {
    listen 443 ssl http2;
    server_name forge.gnomatix.com;

    # ssl_certificate / ssl_certificate_key: the NAS's existing wildcard certificate

    client_max_body_size 0;            # pushes of rendered media
    proxy_request_buffering off;       # stream large pushes straight to Gitea
    proxy_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 30s;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://192.168.1.60:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name forge.gnomatix.com;
    return 301 https://$host$request_uri;
}
