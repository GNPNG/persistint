# Generated by tools/deploy_site.sh from site/site.config.json. Do not edit by hand.
name = "persistint-site"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/play/*/index.wasm"]

[[r2_buckets]]
binding = "GAME"
bucket_name = "persistint-builds"

[[routes]]
pattern = "persistint.dataglut.org"
custom_domain = true
