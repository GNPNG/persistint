<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 76" width="192" height="76" role="img" aria-labelledby="t">
  <title id="t">GNPNG Ping Pong</title>
  <!-- GNPNG Ping Pong imprint (kids' imprint): G|P|G mark with the pong animation from
       gnpng.org/marks/gnpng-pingpong.svg, in the imprint's colours and Cooper Black stack
       (gnpng.org/styles/site.css .imprint-pp). -->
  <rect width="192" height="76" rx="16" fill="#E07A8A"/>
  <circle cx="184" cy="6" r="22" fill="#F2C94C"/>
  <g font-family="'Cooper Black', 'Recoleta', serif" font-weight="900" font-size="46" fill="#0D2137" text-anchor="middle">
    <text x="36" y="56">G</text>
    <text x="96" y="56">P</text>
    <text x="156" y="56">G</text>
  </g>
  <rect x="60" y="24" width="8" height="36" rx="2" fill="#0D2137">
    <animate attributeName="y" values="24;32;18;28;24" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="124" y="24" width="8" height="36" rx="2" fill="#0D2137">
    <animate attributeName="y" values="28;20;34;24;28" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="93" y="30" width="6" height="6" rx="1" fill="#F2C94C">
    <animate attributeName="x" values="66;122;66" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="y" values="28;42;22;38;28" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
